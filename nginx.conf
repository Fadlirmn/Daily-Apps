server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: semua route kembali ke index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache aset statis hasil build Vite (hashed filenames)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
